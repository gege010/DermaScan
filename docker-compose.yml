services:
  api:
    build:
      context: .
      dockerfile: deployment/api/Dockerfile
    restart: unless-stopped
    environment:
      ENABLE_LEGACY_MODEL: "false"
      REQUIRE_MODEL: "false"
      ANALYSIS_RATE_LIMIT: "60"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
    volumes:
      - ./models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2"
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=1m,mode=1777
