name: Verify DermaScan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: pip check
      - run: ruff check src/dermascan deployment/api/main.py scripts/train_compact.py scripts/smoke_legacy_model.py tests
      - run: ruff format --check src/dermascan deployment/api/main.py scripts/train_compact.py scripts/smoke_legacy_model.py tests
      - run: pip-audit -r requirements.txt --progress-spinner off
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
