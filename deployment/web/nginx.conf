limit_req_zone $binary_remote_addr zone=analysis:10m rate=6r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 11m;
    client_body_timeout 15s;
    access_log off;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health-web { access_log off; return 200 'ok'; }
    location = /api/v1/analyze {
        limit_req zone=analysis burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_read_timeout 45s;
        proxy_send_timeout 15s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location /api/ { proxy_pass http://api:8000; proxy_read_timeout 45s; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
